name: Java CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '8', '17', '21' ]
    name: Java ${{ matrix.Java }} build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
          cache: 'maven'
          cache-dependency-path: 'pom.xml'
      - name: Build with Maven
        # 根 pom 默认 maven.test.skip=true，必须显式覆盖，否则测试会被静默跳过
        run: mvn clean package -P !develop -Dmaven.test.skip=false
